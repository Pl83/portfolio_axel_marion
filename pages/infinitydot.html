<!DOCTYPE html>
<html lang="fr">
	<head>
		<meta charset="utf-8">
		<link rel="icon" type="image/svg+xml" href="/logo.svg" />
		<title>infinity dot</title>
		<script type="module" src="../src/infinity.js" defer></script>
		<link rel="stylesheet" href="../src/infinity.css">
		<style>
			#controls-hint {
				position: fixed;
				bottom: 36px;
				left: 50%;
				transform: translateX(-50%);
				background: rgba(8,8,8,0.82);
				border: 1px solid rgba(255,255,255,0.1);
				border-radius: 14px;
				padding: 20px 32px;
				color: #fff;
				font-family: 'Outfit', system-ui, sans-serif;
				font-size: 13px;
				backdrop-filter: blur(14px);
				-webkit-backdrop-filter: blur(14px);
				z-index: 100;
				opacity: 1;
				transition: opacity 0.9s ease;
				pointer-events: none;
				user-select: none;
				white-space: nowrap;
			}

			#controls-hint.fade-out { opacity: 0; }

			.hint-title {
				font-size: 10px;
				font-weight: 600;
				text-transform: uppercase;
				letter-spacing: 0.14em;
				color: rgba(255,255,255,0.35);
				margin: 0 0 14px;
				text-align: center;
			}

			.hint-grid {
				display: grid;
				grid-template-columns: auto 1fr;
				gap: 9px 18px;
				align-items: center;
			}

			.hint-key {
				display: inline-flex;
				align-items: center;
				justify-content: center;
				background: rgba(255,255,255,0.08);
				border: 1px solid rgba(255,255,255,0.14);
				border-radius: 6px;
				padding: 4px 10px;
				font-family: monospace;
				font-size: 12px;
				font-weight: 700;
				color: #d8c7ff;
				letter-spacing: 0.04em;
			}

			.hint-desc {
				color: rgba(255,255,255,0.55);
				font-size: 12px;
			}
		</style>
	</head>
	<body>
		<div id="container"></div>

		<div id="controls-hint">
			<p class="hint-title">Contrôles</p>
			<div class="hint-grid">
				<span class="hint-key">Clic</span>
				<span class="hint-desc">Activer la souris</span>

				<span class="hint-key">WASD</span>
				<span class="hint-desc">Se déplacer</span>

				<span class="hint-key">Espace</span>
				<span class="hint-desc">Monter</span>

				<span class="hint-key">Shift</span>
				<span class="hint-desc">Descendre</span>
			</div>
		</div>

		<script>
			const hint = document.getElementById('controls-hint');
			setTimeout(() => {
				hint.classList.add('fade-out');
				setTimeout(() => hint.remove(), 950);
			}, 4000);
		</script>
	</body>
</html>
