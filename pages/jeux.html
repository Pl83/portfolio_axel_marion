<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Axel Marion — Jeux</title>
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="stylesheet" href="../src/style.css">

  <style>
    /* ─── Hero ─── */
    .hero {
      position: sticky;
      top: 0;
      height: 60vh;
      min-height: 420px;
      padding: calc(var(--header-h) + 40px) clamp(20px, 6vw, 96px) 70px;
      display: flex;
      align-items: center;
      overflow: hidden;
      background: var(--bg);
      will-change: filter;
    }

    .hero::after {
      content: '';
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(15,15,15,1) 0%, rgba(15,15,15,.88) 42%, rgba(15,15,15,.35) 100%),
        radial-gradient(ellipse 60% 50% at 70% 50%, rgba(155,109,255,.24), transparent 70%),
        url('https://images.unsplash.com/photo-1518709268805-4e9042af2176?auto=format&fit=crop&w=1800&q=80') center/cover;
      transform: scale(1.08);
      z-index: 0;
      pointer-events: none;
    }

    .hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.05'/%3E%3C/svg%3E");
      background-size: 200px;
      pointer-events: none;
      z-index: 1;
    }

    .hero-content {
      position: relative;
      z-index: 2;
      max-width: 720px;
    }

    .hero-sub {
      font-size: .88rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 16px;
    }

    .hero-title {
      font-family: var(--font-d);
      font-size: clamp(4rem, 9vw, 8rem);
      line-height: .95;
      color: #fff;
      margin-bottom: 20px;
    }

    .hero-accent {
      color: var(--accent2);
      font-size: clamp(2.4rem, 5vw, 5.4rem);
    }

    .hero-desc {
      color: var(--muted);
      max-width: 560px;
      line-height: 1.75;
      margin-bottom: 34px;
    }

    /* ─── Section ─── */
    .section {
      position: relative;
      z-index: 2;
      background: var(--bg);
    }

    /* ─── Filters ─── */
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .filter-group {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .filter-sep {
      width: 1px;
      height: 28px;
      background: var(--border);
      align-self: center;
    }

    .filter-bar button {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      font-family: var(--font-b);
      font-size: .73rem;
      font-weight: 600;
      letter-spacing: .09em;
      text-transform: uppercase;
      padding: 8px 13px;
      border-radius: 4px;
      cursor: pointer;
      transition: .18s;
    }

    .filter-bar button:hover,
    .filter-bar button.active {
      color: #fff;
      border-color: var(--accent);
      background: rgba(155,109,255,.12);
    }

    .filter-count {
      margin-left: auto;
      font-size: .78rem;
      color: var(--muted);
      white-space: nowrap;
      align-self: center;
    }

    .filter-count strong {
      color: var(--accent2);
    }

    /* ─── Layout ─── */
    .games-layout {
      display: block;
      position: relative;
    }

    /* ─── Game grid ─── */
    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 2px;
    }

    .game-card {
      background: var(--bg2);
      cursor: pointer;
      transition: background .22s;
      outline: 2px solid transparent;
      outline-offset: -2px;
      overflow: hidden;
      position: relative;
    }

    .game-card:hover { background: var(--bg3); }

    .game-card.active {
      background: var(--bg3);
      outline-color: var(--accent);
    }

    .game-img {
      aspect-ratio: 16/9;
      overflow: hidden;
      background: #0a0a0a;
    }

    .game-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform .4s cubic-bezier(.25,.46,.45,.94);
    }

    .game-card:hover img,
    .game-card.active img { transform: scale(1.04); }

    .game-info {
      padding: 16px 18px 18px;
    }

    .game-type-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: .67rem;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 3px;
      margin-bottom: 9px;
    }

    .game-type-badge.type-jeu      { background: rgba(155,109,255,.18); color: #c4a0ff; }
    .game-type-badge.type-carte    { background: rgba(103,212,255,.15); color: #8ee7ff; }
    .game-type-badge.type-proto    { background: rgba(116,214,116,.15); color: #9ef0a0; }
    .game-type-badge.type-blocking { background: rgba(255,180,92,.15);  color: #ffd09a; }

    .game-info h3 {
      font-size: .95rem;
      font-weight: 600;
      color: #fff;
      line-height: 1.3;
      margin-bottom: 4px;
    }

    .game-info p {
      font-size: .78rem;
      color: var(--muted);
    }

    .game-arrow {
      position: absolute;
      bottom: 14px;
      right: 16px;
      color: var(--accent2);
      font-size: .85rem;
      opacity: 0;
      transition: opacity .2s;
    }

    .game-card:hover .game-arrow,
    .game-card.active .game-arrow { opacity: 1; }

    /* ─── Empty state ─── */
    .empty-state {
      grid-column: 1 / -1;
      padding: 60px 20px;
      text-align: center;
      color: var(--muted);
      font-size: .9rem;
    }

    /* ─── Tools list ─── */
    .tools-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 24px;
    }

    .tool {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 7px 12px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: rgba(255,255,255,0.03);
      transition: .22s;
    }

    .tool:hover {
      background: rgba(155,109,255,.14);
      border-color: var(--accent);
    }

    .tool-icon { width: 15px; height: 15px; opacity: .9; }
    .tool-name { font-size: .73rem; letter-spacing: .05em; color: var(--text); }

    .contrib-title {
      font-size: .7rem;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--accent2);
      margin-bottom: 10px;
    }

    .contrib-list {
      padding-left: 18px;
      color: var(--muted);
      line-height: 1.9;
      font-size: .88rem;
    }

    /* ─── Desktop: two-column layout ─── */
    @media (min-width: 920px) {
      .games-layout {
        display: grid;
        grid-template-columns: 1fr 400px;
        align-items: start;
      }

      .detail-panel {
        position: sticky !important;
        top: var(--header-h) !important;
        right: auto !important;
        width: 100% !important;
        height: calc(100vh - var(--header-h)) !important;
        transform: none !important;
        opacity: 1 !important;
        pointer-events: auto !important;
        box-shadow: none !important;
        border-left: 1px solid var(--border);
        grid-row: 1;
        grid-column: 2;
      }

      .detail-panel .detail-close { display: none; }

      .detail-overlay { display: none !important; }
    }

    @media (max-width: 768px) {
      .hero { height: 56vh; min-height: 380px; }
      .filter-sep { display: none; }
    }
  </style>
</head>

<body>
  <header id="header">
    <a href="/index.html" class="logo">A<span>M</span></a>

    <nav class="nav-links">
      <a href="/index.html">Accueil</a>
      <a href="/pages/projet.html">Projets</a>
      <a href="/pages/jeux.html" class="active">Jeux</a>
      <a href="/pages/a-propos.html">À propos</a>
    </nav>

    <button class="burger" id="burgerBtn" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
  </header>

  <div class="drawer" id="drawer">
    <a href="/index.html">Accueil</a>
    <a href="/pages/projet.html">Projets</a>
    <a href="/pages/jeux.html">Jeux</a>
    <a href="/pages/a-propos.html">À propos</a>
  </div>
  <div class="drawer-overlay" id="drawerOverlay"></div>

  <section id="hero" class="hero">
    <div class="hero-content">
      <p class="hero-sub">Portfolio jeu vidéo</p>
      <h1 class="hero-title">
        Jeux<br>
        <span class="hero-accent">Design · Level · Dev</span>
      </h1>
      <p class="hero-desc">
        Projets réalisés en équipe ou en solo, en cours ou sur mon temps libre.
      </p>
    </div>
  </section>

  <section id="jeux" class="section">
    <div class="section-header">
      <div class="section-label"><span class="dot"></span>Tous les jeux</div>
      <div class="filter-bar" id="filterBar">
        <div class="filter-group" id="typeFilter">
          <button data-type="all" class="active">Tous</button>
          <button data-type="Jeu vidéo">Jeu vidéo</button>
          <button data-type="Jeu de cartes">Cartes</button>
          <button data-type="Prototype">Prototype</button>
          <button data-type="Blocking">Blocking</button>
        </div>

        <div class="filter-sep"></div>

        <div class="filter-group" id="modeFilter">
          <button data-mode="all" class="active">Tous modes</button>
          <button data-mode="Solo">Solo</button>
          <button data-mode="Équipe">Équipe</button>
        </div>

        <span class="filter-count" id="filterCount"></span>
      </div>
    </div>

    <div class="games-layout">
      <div class="games-grid" id="gamesGrid"></div>
      <aside class="detail-panel" id="detailPanel">
        <p style="color:var(--muted);padding:40px 20px;text-align:center;font-size:.9rem;">
          Sélectionnez un projet pour voir les détails.
        </p>
      </aside>
      <div class="detail-overlay" id="detailOverlay"></div>
    </div>
  </section>

  <footer>© 2025 Axel Marion</footer>

  <script src="/data.js"></script>
  <script>
    const games = window.GAMES;


    const gamesGrid = document.getElementById('gamesGrid');
    const detailPanel = document.getElementById('detailPanel');
    const detailOverlay = document.getElementById('detailOverlay');
    const filterCount = document.getElementById('filterCount');

    let activeType = 'all';
    let activeMode = 'all';
    let activeCardEl = null;

    function getTypeBadgeClass(type) {
      const map = {
        'Jeu vidéo':    'type-jeu',
        'Jeu de cartes':'type-carte',
        'Prototype':    'type-proto',
        'Blocking':     'type-blocking',
      };
      return map[type] || 'type-jeu';
    }

    function displayGames() {
      gamesGrid.innerHTML = '';

      const filtered = games.filter(g => {
        const matchType = activeType === 'all' || g.type === activeType;
        const matchMode = activeMode === 'all' || g.mode === activeMode;
        return matchType && matchMode;
      });

      filterCount.innerHTML = `<strong>${filtered.length}</strong> projet${filtered.length > 1 ? 's' : ''}`;

      if (filtered.length === 0) {
        gamesGrid.innerHTML = '<div class="empty-state">Aucun projet ne correspond à ces filtres.</div>';
        return;
      }

      filtered.forEach((game, index) => {
        const card = document.createElement('article');
        card.className = 'game-card';
        card.setAttribute('tabindex', '0');
        card.innerHTML = `
          <div class="game-img"><img src="${game.image}" alt="${game.title}" loading="lazy"></div>
          <div class="game-info">
            <span class="game-type-badge ${getTypeBadgeClass(game.type)}">${game.type}</span>
            <h3>${game.title}</h3>
            <p>${game.year} · ${game.platform}</p>
          </div>
          <span class="game-arrow">↗</span>
        `;

        card.addEventListener('click', () => selectCard(card, game));
        card.addEventListener('keydown', e => {
          if (e.key === 'Enter' || e.key === ' ') selectCard(card, game);
        });

        gamesGrid.appendChild(card);

        if (index === 0) {
          card.classList.add('active');
          activeCardEl = card;
          displayDetails(game);
        }
      });
    }

    function selectCard(card, game) {
      if (activeCardEl) activeCardEl.classList.remove('active');
      card.classList.add('active');
      activeCardEl = card;
      displayDetails(game);
      if (window.innerWidth < 920) openDetailPanel();
    }

    function displayDetails(game) {
      detailPanel.innerHTML = `
        <button class="detail-close" onclick="closeDetailPanel()">✕</button>
        <h2 class="detail-title">${game.title}</h2>
        <div class="detail-meta">${game.type} · ${game.platform} · ${game.year}</div>
        <img class="detail-cover" src="${game.image}" alt="${game.title}">
        <p class="detail-desc">${game.description}</p>

        <div class="detail-infos">
          <div class="detail-info"><strong>Mon rôle</strong><span>${game.role}</span></div>
          <div class="detail-info"><strong>Équipe</strong><span>${game.team}</span></div>
          <div class="detail-info"><strong>Moteur</strong><span>${game.engine}</span></div>
          <div class="detail-info"><strong>Durée</strong><span>${game.duration}</span></div>
        </div>

        <h3 class="contrib-title">Outils</h3>
        <div class="tools-list">
          ${game.tools.map(tool => {
            const icon = getToolIcon(tool);
            return `<div class="tool">${icon ? `<img src="${icon}" class="tool-icon" alt="${tool}">` : ''}<span class="tool-name">${tool}</span></div>`;
          }).join('')}
        </div>

        <h3 class="contrib-title">Mes contributions</h3>
        <ul class="contrib-list">
          ${game.contributions.map(item => `<li>${item}</li>`).join('')}
        </ul>
      `;
    }

    function openDetailPanel() {
      detailPanel.classList.add('open');
      detailOverlay.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeDetailPanel() {
      detailPanel.classList.remove('open');
      detailOverlay.classList.remove('open');
      document.body.style.overflow = '';
    }

    detailOverlay.addEventListener('click', closeDetailPanel);

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeDetailPanel();
    });

    function getToolIcon(tool) {
      const icons = {
        "Unity":        "https://cdn.simpleicons.org/unity/ffffff",
        "Blender":      "https://cdn.simpleicons.org/blender/ffffff",
        "C#":           "https://cdn.simpleicons.org/csharp/ffffff",
        "Three.js":     "https://cdn.simpleicons.org/threedotjs/ffffff",
        "Vue.js":       "https://cdn.simpleicons.org/vuedotjs/ffffff",
        "Photoshop":    "https://cdn.simpleicons.org/adobephotoshop/ffffff",
        "Illustrator":  "https://cdn.simpleicons.org/adobeillustrator/ffffff",
        "JavaScript":   "https://cdn.simpleicons.org/javascript/ffffff",
      };
      return icons[tool] || null;
    }

    // ── Type filter ──────────────────────────────────────────────
    document.querySelectorAll('[data-type]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('[data-type]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeType = btn.dataset.type;
        displayGames();
      });
    });

    // ── Mode filter ──────────────────────────────────────────────
    document.querySelectorAll('[data-mode]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('[data-mode]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeMode = btn.dataset.mode;
        displayGames();
      });
    });

    // ── Hero blur ────────────────────────────────────────────────
    const hero = document.getElementById('hero');
    function updateHeroOnScroll() {
      const progress = Math.min(window.scrollY / (window.innerHeight * 0.6), 1);
      hero.style.filter = `blur(${progress * 7}px)`;
      hero.style.opacity = Math.max(0.25, 1 - progress * 0.7);
    }
    window.addEventListener('scroll', updateHeroOnScroll, { passive: true });

    displayGames();
    updateHeroOnScroll();
  </script>

  <script>
    (function() {
      const btn = document.getElementById('burgerBtn');
      const drawer = document.getElementById('drawer');
      const overlay = document.getElementById('drawerOverlay');
      if (!btn || !drawer) return;
      btn.addEventListener('click', () => {
        const open = drawer.classList.toggle('open');
        btn.classList.toggle('open', open);
        if (overlay) overlay.style.display = open ? 'block' : 'none';
      });
      drawer.querySelectorAll('a').forEach(a => {
        a.addEventListener('click', () => {
          drawer.classList.remove('open');
          btn.classList.remove('open');
          if (overlay) overlay.style.display = 'none';
        });
      });
      if (overlay) overlay.addEventListener('click', () => {
        drawer.classList.remove('open');
        btn.classList.remove('open');
        overlay.style.display = 'none';
      });
    })();
  </script>
</body>
</html>
