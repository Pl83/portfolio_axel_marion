<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Axel Marion — Jeux</title>

  <link rel="stylesheet" href="../src/style.css">

  <style>
    .hero {
      position: sticky;
      top: 0;
      height: 60vh;
      min-height: 420px;
      padding: calc(var(--header-h) + 40px) clamp(20px, 6vw, 96px) 70px;
      display: flex;
      align-items: center;
      overflow: hidden;
      background: var(--bg);
      will-change: filter;
    }

    .hero::after {
      content: '';
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(15,15,15,1) 0%, rgba(15,15,15,.88) 42%, rgba(15,15,15,.35) 100%),
        radial-gradient(ellipse 60% 50% at 70% 50%, rgba(155,109,255,.24), transparent 70%),
        url('https://images.unsplash.com/photo-1518709268805-4e9042af2176?auto=format&fit=crop&w=1800&q=80') center/cover;
      transform: scale(1.08);
      z-index: 0;
      pointer-events: none;
    }

    .hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.05'/%3E%3C/svg%3E");
      background-size: 200px;
      pointer-events: none;
      z-index: 1;
    }

    .hero-content {
      position: relative;
      z-index: 2;
      max-width: 720px;
    }

    .hero-sub {
      font-size: .88rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 16px;
    }

    .hero-title {
      font-family: var(--font-d);
      font-size: clamp(4rem, 9vw, 8rem);
      line-height: .95;
      color: #fff;
      margin-bottom: 20px;
    }

    .hero-accent {
      color: var(--accent2);
      font-size: clamp(2.4rem, 5vw, 5.4rem);
    }

    .hero-desc {
      color: var(--muted);
      max-width: 560px;
      line-height: 1.75;
      margin-bottom: 34px;
    }

    .section {
      position: relative;
      z-index: 2;
      background: var(--bg);
    }

    /* Filters */
    .filters { display: flex; gap: 10px; flex-wrap: wrap; }

    .tools-filter {
      margin-top: 14px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .filters button,
    .tools-filter button {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      font-family: var(--font-b);
      font-size: .76rem;
      font-weight: 500;
      letter-spacing: .08em;
      text-transform: uppercase;
      padding: 10px 14px;
      border-radius: 4px;
      cursor: pointer;
      transition: .2s;
    }

    .filters button:hover,
    .filters button.active,
    .tools-filter button:hover,
    .tools-filter button.active {
      color: #fff;
      border-color: var(--accent);
      background: rgba(155,109,255,.10);
    }


    /* Game grid */
    .games-layout {
      display: block;
      position: relative;
    }

    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 2px;
    }

    .game-card {
      background: var(--bg2);
      cursor: pointer;
      transition: background .22s, outline .22s;
      outline: 1px solid transparent;
      overflow: hidden;
    }

    .game-card:hover,
    .game-card.active {
      background: var(--bg3);
      outline-color: rgba(192,132,252,.45);
      z-index: 1;
    }

    .game-img {
      aspect-ratio: 4/3;
      overflow: hidden;
      background: #0a0a0a;
    }

    .game-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform .4s cubic-bezier(.25,.46,.45,.94);
    }

    .game-card:hover img { transform: scale(1.04); }

    .game-info {
      padding: 20px 22px 24px;
      position: relative;
      min-height: 142px;
    }

    .game-cat {
      font-size: .68rem;
      font-weight: 600;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--accent2);
      display: block;
      margin-bottom: 8px;
    }

    .game-info h3 {
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
      line-height: 1.3;
      margin-bottom: 6px;
    }

    .game-info p {
      font-size: .84rem;
      color: var(--muted);
    }

    .game-arrow {
      position: absolute;
      right: 20px;
      bottom: 20px;
      color: var(--muted);
    }

    /* Tool badges in detail panel */
    .tool {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: rgba(255,255,255,0.03);
      transition: .25s;
    }

    .tool:hover {
      background: rgba(155,109,255,.15);
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    .tool-icon {
      width: 16px;
      height: 16px;
      opacity: .9;
    }

    .tool-name {
      font-size: .75rem;
      letter-spacing: .06em;
      color: var(--text);
    }

    .contrib-title {
      color: var(--accent2);
      font-size: .85rem;
      margin-bottom: 10px;
    }

    .contrib-list {
      padding-left: 18px;
      color: var(--muted);
      line-height: 1.9;
      font-size: .9rem;
    }

    @media (max-width: 768px) {
      .hero {
        height: 56vh;
        min-height: 380px;
      }
    }
  </style>
</head>

    const gamesGrid = document.getElementById('gamesGrid');
    const detailPanel = document.getElementById('detailPanel');
    const detailOverlay = document.getElementById('detailOverlay');
    const filterButtons = document.querySelectorAll('.filters button');
    const toolsFilter = document.getElementById('toolsFilter');
    const burgerBtn = document.getElementById('burgerBtn');
    const drawer = document.getElementById('drawer');
    const hero = document.getElementById('hero');
    const heroContent = document.querySelector('.hero-content');
    let activeType = 'all';
    let activeMode = 'all';
    let activeTool = 'all';


    function displayGames() {
      gamesGrid.innerHTML = '';

      const filteredGames = games.filter(game => {
      const matchType = activeType === 'all' || game.type === activeType;
      const matchMode = activeMode === 'all' || game.mode === activeMode;
      const matchTool = activeTool === 'all' || game.tools.includes(activeTool);

      return matchType && matchMode && matchTool;
    });

      filteredGames.forEach((game, index) => {
        const card = document.createElement('article');
        card.className = 'game-card';
        card.innerHTML = `
          <div class="game-img"><img src="${game.image}" alt="${game.title}"></div>
          <div class="game-info">
            <span class="game-cat">${game.type}</span>
            <h3>${game.title}</h3>
            <p>${game.year} · ${game.platform}</p>
            <span class="game-arrow">↗</span>
          </div>
        `;

        card.addEventListener('click', () => {
          document.querySelectorAll('.game-card').forEach(c => c.classList.remove('active'));
          card.classList.add('active');
          displayDetails(game);
          openDetailPanel();
        });

        gamesGrid.appendChild(card);

        if (index === 0) {
          card.classList.add('active');
          displayDetails(game);
        }
      });

      if (filteredGames.length === 0) {
        detailPanel.innerHTML = '<p>Aucun projet ne correspond à ce filtre.</p>';
      }
    }

    // ---------- TYPE ----------
    document.querySelectorAll('[data-type]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('[data-type]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeType = btn.dataset.type;
        displayGames();
      });
    });

    // ---------- MODE ----------
    document.querySelectorAll('[data-mode]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('[data-mode]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeMode = btn.dataset.mode;
        displayGames();
      });
    });

    function displayDetails(game) {
      detailPanel.innerHTML = `
        <button class="detail-close" onclick="closeDetailPanel()">✕</button>
        <h2 class="detail-title">${game.title}</h2>
        <div class="detail-meta">${game.type} · ${game.platform} · ${game.year}</div>
        <img class="detail-cover" src="${game.image}" alt="${game.title}">
        <p class="detail-desc">${game.description}</p>

        <div class="detail-infos">
          <div class="detail-info"><strong>Mon rôle</strong><span>${game.role}</span></div>
          <div class="detail-info"><strong>Équipe</strong><span>${game.team}</span></div>
          <div class="detail-info"><strong>Moteur</strong><span>${game.engine}</span></div>
          <div class="detail-info"><strong>Durée</strong><span>${game.duration}</span></div>
        </div>

        <h3 class="contrib-title">Outils</h3>
        <div class="tools-list">
          ${game.tools.map(tool => `
            <div class="tool">
              ${getToolIcon(tool) ? `<img src="${getToolIcon(tool)}" class="tool-icon" alt="${tool}">` : ''}
              <span class="tool-name">${tool}</span>
            </div>
          `).join('')}
        </div>

        <h3 class="contrib-title">Mes contributions</h3>
        <ul class="contrib-list">
          ${game.contributions.map(item => `<li>${item}</li>`).join('')}
        </ul>
      `;
    }

    function openDetailPanel() {
      detailPanel.classList.add('open');
      detailOverlay.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeDetailPanel() {
      detailPanel.classList.remove('open');
      detailOverlay.classList.remove('open');
      document.body.style.overflow = '';
    }

    detailOverlay.addEventListener('click', closeDetailPanel);

    function getToolIcon(tool) {
      const icons = {
        "Unity": "https://cdn.simpleicons.org/unity/ffffff",
        "Blender": "https://cdn.simpleicons.org/blender/ffffff",
        "C#": "https://cdn.simpleicons.org/csharp/ffffff",
        "Three.js": "https://cdn.simpleicons.org/threedotjs/ffffff",
        "Vue.js": "https://cdn.simpleicons.org/vuedotjs/ffffff",
        "Photoshop": "https://cdn.simpleicons.org/adobephotoshop/ffffff",
        "Illustrator": "https://cdn.simpleicons.org/adobeillustrator/ffffff",
        "PandaSuite": null,
        "JavaScript": "https://cdn.simpleicons.org/javascript/ffffff",
        "VR": null
      };

      return icons[tool] || null;
    }

    function buildToolFilters() {
      const tools = ['all', ...new Set(games.flatMap(game => game.tools))];

      toolsFilter.innerHTML = tools.map(tool => `
        <button class="${tool === 'all' ? 'active' : ''}" data-tool="${tool}">
          ${tool === 'all' ? 'Tous les outils' : tool}
        </button>
      `).join('');

      toolsFilter.querySelectorAll('button').forEach(button => {
        button.addEventListener('click', () => {
          toolsFilter.querySelectorAll('button').forEach(btn => btn.classList.remove('active'));
          button.classList.add('active');
          activeTool = button.dataset.tool;
          displayGames();
        });
      });
    }

    function updateHeroOnScroll() {
      const progress = Math.min(window.scrollY / (window.innerHeight * 0.6), 1);
      hero.style.filter = `blur(${progress * 7}px)`;
      hero.style.opacity = Math.max(0.25, 1 - progress * 0.7);
    }
    window.addEventListener('scroll', updateHeroOnScroll, { passive: true });

    filterButtons.forEach(button => {
      button.addEventListener('click', () => {
        filterButtons.forEach(btn => btn.classList.remove('active'));
        button.classList.add('active');
        activeCategory = button.dataset.filter;
        displayGames();
      });
    });

    displayGames();
    buildToolFilters();
    updateHeroOnScroll();
  </script>

  <script>
    (function() {
      const btn = document.getElementById('burgerBtn');
      const drawer = document.getElementById('drawer');
      const overlay = document.getElementById('drawerOverlay');
      if (!btn || !drawer) return;
      btn.addEventListener('click', () => {
        const open = drawer.classList.toggle('open');
        btn.classList.toggle('open', open);
        if (overlay) overlay.style.display = open ? 'block' : 'none';
      });
      drawer.querySelectorAll('a').forEach(a => {
        a.addEventListener('click', () => {
          drawer.classList.remove('open');
          btn.classList.remove('open');
          if (overlay) overlay.style.display = 'none';
        });
      });
      if (overlay) overlay.addEventListener('click', () => {
        drawer.classList.remove('open');
        btn.classList.remove('open');
        overlay.style.display = 'none';
      });
    })();
  </script>
