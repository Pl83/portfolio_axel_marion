<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Axel Marion — Jeux</title>
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="stylesheet" href="../src/style.css">
  <script src="/data.js"></script>

  <style>
    /* ─── Hero ─── */
    .hero {
      position: sticky;
      top: 0;
      min-height: var(--hero-h);
      padding: calc(var(--header-h) + 40px) clamp(20px, 6vw, 96px) 70px;
      display: flex;
      align-items: center;
      overflow: hidden;
      background: var(--bg);
      will-change: filter;
    }

    .hero::after {
      content: '';
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(var(--bg-rgb),1) 0%, rgba(var(--bg-rgb),.88) 42%, rgba(var(--bg-rgb),.35) 100%),
        url('https://images.unsplash.com/photo-1518709268805-4e9042af2176?auto=format&fit=crop&w=1800&q=80') center/cover;
      transform: scale(1.08);
      z-index: 0;
      pointer-events: none;
    }

    .hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        var(--hero-glow),
        var(--hero-noise-strong);
      background-size: 100%, 200px;
      pointer-events: none;
      z-index: 1;
    }

    .hero-content {
      position: relative;
      z-index: 2;
      max-width: 720px;
    }

    .hero-sub {
      font-size: .88rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 16px;
    }

    .hero-title {
      font-family: var(--font-d);
      font-size: clamp(4rem, 9vw, 8rem);
      line-height: .95;
      color: var(--white);
      margin-bottom: 20px;
    }

    .hero-accent {
      color: var(--accent2);
      font-size: clamp(2.4rem, 5vw, 5.4rem);
    }

    .hero-desc {
      color: var(--muted);
      max-width: 560px;
      line-height: 1.75;
      margin-bottom: 34px;
    }

    /* ─── Section ─── */
    .section {
      position: relative;
      z-index: 2;
      background: var(--bg);
    }

    /* ─── Filters ─── */
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .filter-group {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .filter-sep {
      width: 1px;
      height: 28px;
      background: var(--border);
      align-self: center;
    }

    .filter-bar button {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      font-family: var(--font-b);
      font-size: .73rem;
      font-weight: 600;
      letter-spacing: .09em;
      text-transform: uppercase;
      padding: 8px 13px;
      border-radius: 4px;
      cursor: pointer;
      transition: .18s;
    }

    .filter-bar button:hover,
    .filter-bar button.active {
      color: var(--white);
      border-color: var(--accent);
      background: rgba(var(--accent-rgb),.12);
    }

    .filter-bar button[data-type="Jeux"]:hover,
    .filter-bar button[data-type="Jeux"].active {
      color: var(--jeux-text);
      border-color: var(--jeux);
      background: rgba(var(--jeux-rgb),.12);
      box-shadow: 0 0 10px rgba(var(--jeux-rgb),.4);
    }

    .filter-bar button[data-type="Prototype"]:hover,
    .filter-bar button[data-type="Prototype"].active {
      color: var(--prototype-text);
      border-color: var(--prototype);
      background: rgba(var(--prototype-rgb),.12);
      box-shadow: 0 0 10px rgba(var(--prototype-rgb),.4);
    }

    .filter-bar button[data-type="Blocking"]:hover,
    .filter-bar button[data-type="Blocking"].active {
      color: var(--blocking-text);
      border-color: var(--blocking);
      background: rgba(var(--blocking-rgb),.12);
      box-shadow: 0 0 10px rgba(var(--blocking-rgb),.4);
    }

    .filter-count {
      margin-left: auto;
      font-size: .78rem;
      color: var(--muted);
      white-space: nowrap;
      align-self: center;
    }

    .filter-count strong {
      color: var(--accent2);
    }

    /* ─── Layout ─── */
    .games-layout {
      display: block;
      position: relative;
    }

    /* ─── Game grid ─── */
    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 22px;
    }

    .game-card {
      background: var(--bg2);
      cursor: pointer;
      transition: background .22s, box-shadow .22s, outline-color .22s;
      outline: 1px solid transparent;
      overflow: hidden;
      position: relative;
      border-radius: 6px;
    }

    .game-card:hover { background: var(--bg3); }

    .game-card.active { background: var(--bg3); }

    .game-card.type-jeu,
    .game-card.type-carte {
      outline-color: rgba(var(--jeux-rgb),.35);
      box-shadow: 0 0 9px rgba(var(--jeux-rgb),.18);
    }

    .game-card.type-proto {
      outline-color: rgba(var(--prototype-rgb),.35);
      box-shadow: 0 0 9px rgba(var(--prototype-rgb),.18);
    }

    .game-card.type-blocking {
      outline-color: rgba(var(--blocking-rgb),.35);
      box-shadow: 0 0 9px rgba(var(--blocking-rgb),.18);
    }

    .game-card.type-jeu:hover, .game-card.type-jeu.active,
    .game-card.type-carte:hover, .game-card.type-carte.active {
      outline-color: var(--jeux);
      box-shadow: 0 0 18px rgba(var(--jeux-rgb),.5);
    }

    .game-card.type-proto:hover, .game-card.type-proto.active {
      outline-color: var(--prototype);
      box-shadow: 0 0 18px rgba(var(--prototype-rgb),.5);
    }

    .game-card.type-blocking:hover, .game-card.type-blocking.active {
      outline-color: var(--blocking);
      box-shadow: 0 0 18px rgba(var(--blocking-rgb),.5);
    }

    .game-img {
      aspect-ratio: 16/9;
      overflow: hidden;
      background: var(--surface-media-alt);
    }

    .game-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform .4s cubic-bezier(.25,.46,.45,.94);
    }

    .game-card:hover img,
    .game-card.active img { transform: scale(1.04); }

    .game-info {
      padding: 16px 18px 18px;
    }

    .game-type-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: .67rem;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 3px;
      margin-bottom: 9px;
    }

    .game-type-badge.type-jeu      { background: rgba(var(--jeux-rgb),.18); color: var(--jeux-text); box-shadow: 0 0 8px rgba(var(--jeux-rgb),.4); }
    .game-type-badge.type-carte    { background: rgba(var(--jeux-rgb),.18); color: var(--jeux-text); box-shadow: 0 0 8px rgba(var(--jeux-rgb),.4); }
    .game-type-badge.type-proto    { background: rgba(var(--prototype-rgb),.15); color: var(--prototype-text); box-shadow: 0 0 8px rgba(var(--prototype-rgb),.4); }
    .game-type-badge.type-blocking { background: rgba(var(--blocking-rgb),.15);  color: var(--blocking-text); box-shadow: 0 0 8px rgba(var(--blocking-rgb),.4); }

    .game-info h3 {
      font-size: .95rem;
      font-weight: 600;
      color: var(--white);
      line-height: 1.3;
      margin-bottom: 4px;
    }

    .game-info p {
      font-size: .78rem;
      color: var(--muted);
    }

    .game-arrow {
      position: absolute;
      bottom: 14px;
      right: 16px;
      color: var(--accent2);
      font-size: .85rem;
      opacity: 0;
      transition: opacity .2s;
    }

    .game-card:hover .game-arrow,
    .game-card.active .game-arrow { opacity: 1; }

    /* ─── Empty state ─── */
    .empty-state {
      grid-column: 1 / -1;
      padding: 60px 20px;
      text-align: center;
      color: var(--muted);
      font-size: .9rem;
    }

    /* ─── Tools list ─── */
    .tools-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 24px;
    }

    .tool {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 7px 12px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: rgba(var(--white-rgb),0.03);
      transition: .22s;
    }

    .tool:hover {
      background: rgba(var(--accent-rgb),.14);
      border-color: var(--accent);
    }

    .tool-icon { width: 15px; height: 15px; opacity: .9; }
    .tool-name { font-size: .73rem; letter-spacing: .05em; color: var(--text); }

    .contrib-title {
      font-size: .7rem;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--accent2);
      margin-bottom: 10px;
    }

    .contrib-list {
      padding-left: 18px;
      color: var(--muted);
      line-height: 1.9;
      font-size: .88rem;
    }

    /* ─── Desktop: two-column layout ─── */
    @media (min-width: 920px) {
      .games-layout {
        display: grid;
        grid-template-columns: 1fr 520px;
        align-items: start;
      }

      .detail-panel {
        position: sticky !important;
        top: var(--header-h) !important;
        right: auto !important;
        width: 100% !important;
        height: calc(100vh - var(--header-h)) !important;
        transform: none !important;
        opacity: 1 !important;
        pointer-events: auto !important;
        box-shadow: none !important;
        border-left: 1px solid var(--border);
        grid-row: 1;
        grid-column: 2;
      }

      .detail-panel .detail-close { display: none; }

      .detail-overlay { display: none !important; }
    }

    @media (max-width: 768px) {
      .filter-sep { display: none; }
    }

    /* ─── Media gallery in detail panel ─── */
    .dp-media-wrap { position: relative; margin-bottom: 16px; }

    .dp-media-stage {
      position: relative;
      width: 100%;
      border-radius: 8px;
      overflow: hidden;
      background: var(--black);
    }

    .dp-video-wrap { display: none; width: 100%; aspect-ratio: 16/9; }
    .dp-video-wrap.active { display: block; }
    .dp-video-wrap iframe { width: 100%; height: 100%; border: 0; display: block; }

    .dp-main-image {
      display: none;
      width: 100%;
      height: auto;
      max-height: 320px;
      object-fit: contain;
      background: var(--black);
      cursor: crosshair;
    }

    .dp-main-image.active { display: block; }

    .dp-zoom-lens {
      position: absolute;
      width: 80px;
      height: 80px;
      border: 2px solid rgba(var(--accent-rgb),.8);
      background: rgba(var(--accent-rgb),.08);
      border-radius: 6px;
      pointer-events: none;
      display: none;
      z-index: 5;
    }

    .dp-zoom-result {
      display: none;
      position: fixed;
      width: 260px;
      height: 260px;
      border: 1px solid rgba(var(--accent-rgb),.35);
      border-radius: 12px;
      overflow: hidden;
      background: var(--black) no-repeat center/cover;
      z-index: 9999;
      box-shadow: 0 20px 50px rgba(var(--black-rgb),.65), 0 0 30px rgba(var(--accent-rgb),.1);
      pointer-events: none;
    }

    .dp-thumbs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 5px;
      margin-top: 6px;
    }

    .dp-thumb {
      height: 50px;
      width: 100%;
      border-radius: 5px;
      border: 1px solid rgba(var(--white-rgb),.08);
      cursor: pointer;
      overflow: hidden;
      background: rgba(var(--white-rgb),.04);
      transition: border-color .2s;
    }

    img.dp-thumb { object-fit: cover; display: block; }

    .dp-thumb:hover { border-color: var(--accent); }

    .dp-thumb.active {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px rgba(var(--accent-rgb),.35);
    }

    .dp-video-thumb {
      position: relative;
      background-size: cover;
      background-position: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      font-weight: 700;
      font-size: 9px;
      text-transform: uppercase;
      color: var(--white);
    }

    .dp-video-thumb::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(var(--black-rgb),.2), rgba(var(--black-rgb),.6));
    }

    .dp-video-thumb span,
    .dp-play-icon { position: relative; z-index: 1; }

    .dp-play-icon {
      width: 20px;
      height: 20px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--accent);
      font-size: 8px;
    }

    .dp-doc-thumb {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      font-size: 9px;
      font-weight: 700;
      color: var(--muted);
      text-align: center;
    }

    .dp-doc-thumb span:first-child { font-size: 16px; }

    .media-caption {
      font-size: .76rem;
      color: rgba(var(--white-rgb),.35);
      font-style: italic;
      min-height: 1em;
      margin-top: 4px;
    }

    @media (max-width: 980px) {
      .dp-zoom-lens,
      .dp-zoom-result { display: none !important; }
      .dp-main-image { cursor: default; }
    }
  </style>
</head>

  <section id="jeux" class="section">

  <footer>© 2025 Axel Marion</footer>

  <script>
    // ── Normalisation ────────────────────────────────────────────
    const TOOL_NAMES = { U:'Unity', Bl:'Blender', Ps:'Photoshop', Il:'Illustrator', Id:'InDesign', UE:'Unreal Engine', VS:'Visual Studio' };
    function normalizeTool(t) { return TOOL_NAMES[t] || t; }

    const games = (window.PROJECTS || [])
      .filter(p => p.jeux)
      .map(p => ({
        ...p,
        image:         p.img,
        description:   p.desc,
        mode:          p.mode || (p.team === 'Solo' ? 'Solo' : 'Équipe'),
        role:          Array.isArray(p.role) ? p.role.join(', ') : (p.role || ''),
        contributions: p.contributions || p.role || [],
        tools:         (p.tools || []).map(normalizeTool),
      }));

    const gamesGrid    = document.getElementById('gamesGrid');
    const detailPanel  = document.getElementById('detailPanel');
    const detailOverlay = document.getElementById('detailOverlay');
    const filterCount  = document.getElementById('filterCount');

    let activeType  = 'all';
    let activeMode  = 'all';
    let activeCardEl = null;

    // ── Helpers media ────────────────────────────────────────────
    function getYoutubeId(url) {
      if (!url) return '';
      const embed = url.match(/embed\/([^?&]+)/);
      if (embed) return embed[1];
      const watch = url.match(/[?&]v=([^&]+)/);
      return watch ? watch[1] : '';
    }

    function getYoutubeThumb(url) {
      const id = getYoutubeId(url);
      return id ? `https://img.youtube.com/vi/${id}/hqdefault.jpg` : '';
    }

    function toEmbedUrl(url) {
      if (!url) return '';
      if (url.includes('/embed/')) return url;
      const id = getYoutubeId(url);
      return id ? `https://www.youtube.com/embed/${id}` : url;
    }

    function toDocEmbedUrl(src) {
      if (!src) return null;
      if (src.includes('docs.google.com'))
        return src.replace(/\/(edit|view|pub)(\?.*)?$/, '/preview');
      return null;
    }

    function getDocIcon(ext) {
      if (['XLS','XLSX','CSV'].includes(ext)) return '📊';
      if (['DOC','DOCX'].includes(ext)) return '📝';
      return '📄';
    }

    function getToolIcon(tool) {
      const icons = {
        "Unity":         "https://cdn.simpleicons.org/unity/ffffff",
        "Blender":       "https://cdn.simpleicons.org/blender/ffffff",
        "Three.js":      "https://cdn.simpleicons.org/threedotjs/ffffff",
        "Vue.js":        "https://cdn.simpleicons.org/vuedotjs/ffffff",
        "JavaScript":    "https://cdn.simpleicons.org/javascript/ffffff",
        "Unreal Engine": "https://cdn.simpleicons.org/unrealengine/ffffff",
        "Photoshop":     null,
        "Illustrator":   null,
        "InDesign":      null,
        "C#":            null,
        "Visual Studio": null,
        "PandaSuite":    null,
        "VR":            null,
      };
      return icons[tool] || null;
    }

    function getTypeBadgeClass(type) {
      const t = type.toLowerCase();
      if (t.includes('cart')) return 'type-carte';
      if (t.includes('proto')) return 'type-proto';
      if (t.includes('block')) return 'type-blocking';
      return 'type-jeu';
    }

    // ── Galerie + zoom ───────────────────────────────────────────
    function updateProjectMedia(game) {
      const videoWrap  = document.getElementById('dpVideoWrap');
      const dpVideo    = document.getElementById('dpVideo');
      const dpImage    = document.getElementById('dpImage');
      const thumbsCont = document.getElementById('dpThumbsContainer');
      const captionEl  = document.getElementById('dpCaption');

      dpVideo.src = 'about:blank';
      videoWrap.classList.remove('active');
      dpImage.src = '';
      dpImage.classList.remove('active');

      const rawGallery = (game.gallery && game.gallery.length) ? game.gallery : (game.thumb ? [] : [game.image]);
      const gallery = rawGallery.map(g => {
        if (typeof g === 'string') return { src: g, caption: '', type: 'image' };
        return { type: 'image', caption: '', ...g };
      });

      const videoList = [
        ...(game.video  ? [game.video]  : []),
        ...(game.videos ? game.videos   : []),
      ];

      // Affiche le premier élément (vidéo en priorité si pas de galerie)
      const first = gallery[0];
      const firstVideo = videoList[0];
      const stage = document.getElementById('dpMediaStage');
      if (first && first.type === 'doc') {
        const embedUrl = toDocEmbedUrl(first.src);
        if (embedUrl) {
          dpVideo.src = embedUrl;
          videoWrap.classList.add('active');
        } else {
          const ext = first.src.split('.').pop().toUpperCase();
          let dc = stage.querySelector('.doc-card');
          if (!dc) { dc = document.createElement('div'); dc.className = 'doc-card'; stage.appendChild(dc); }
          dc.innerHTML = `
            <div class="doc-card-icon">${getDocIcon(ext)}</div>
            <div class="doc-card-name">${first.label || ext}</div>
            <div class="doc-card-ext">${ext}</div>
            <a href="${first.src}" target="_blank" class="doc-card-btn">Ouvrir ↗</a>
            <a href="${first.src}" download class="doc-card-dl">↓ Télécharger</a>`;
          dc.style.display = 'flex';
        }
      } else if (first) {
        dpImage.src = first.src;
        dpImage.alt = game.title;
        dpImage.classList.add('active');
      } else if (firstVideo) {
        dpVideo.src = toEmbedUrl(firstVideo);
        videoWrap.classList.add('active');
      }
      if (captionEl) captionEl.textContent = (first && first.caption) || '';

      // Miniatures
      const allThumbs = [
        ...videoList.map((url, i) => ({
          type: 'video', src: toEmbedUrl(url),
          thumb: getYoutubeThumb(url) || game.image,
          label: videoList.length > 1 ? `Vidéo ${i + 1}` : 'Vidéo',
        })),
        ...gallery,
      ];

      if (allThumbs.length > 1) {
        thumbsCont.style.display = 'grid';
        thumbsCont.innerHTML = allThumbs.map(({ type, src, thumb, label, caption }) => {
          if (type === 'video') {
            return `<button class="dp-thumb dp-video-thumb" type="button"
              data-type="video" data-src="${src}"
              style="background-image:url('${thumb}')">
              <span class="dp-play-icon">▶</span>
              <span>${label}</span>
            </button>`;
          }
          if (type === 'doc') {
            const ext = src.split('.').pop().toUpperCase();
            return `<button class="dp-thumb dp-doc-thumb" type="button"
              data-type="doc" data-src="${src}" data-caption="${caption || ''}">
              <span>${getDocIcon(ext)}</span>
              <span>${label || ext}</span>
            </button>`;
          }
          return `<img class="dp-thumb" src="${src}" alt=""
            data-type="image" data-caption="${caption || ''}">`;
        }).join('');

        // Premier miniature actif
        const first = thumbsCont.querySelector('.dp-thumb');
        if (first) first.classList.add('active');
      } else {
        thumbsCont.style.display = 'none';
        thumbsCont.innerHTML = '';
      }

      enableThumbSelection();
    }

    function enableThumbSelection() {
      const videoWrap = document.getElementById('dpVideoWrap');
      const dpVideo   = document.getElementById('dpVideo');
      const dpImage   = document.getElementById('dpImage');
      const captionEl = document.getElementById('dpCaption');
      const thumbs    = document.querySelectorAll('#dpThumbsContainer .dp-thumb');

      thumbs.forEach(thumb => {
        thumb.addEventListener('click', () => {
          thumbs.forEach(t => t.classList.remove('active'));
          thumb.classList.add('active');

          const stage  = document.getElementById('dpMediaStage');
          const existDc = stage && stage.querySelector('.doc-card');

          if (thumb.dataset.type === 'video') {
            dpImage.classList.remove('active');
            dpVideo.src = thumb.dataset.src;
            videoWrap.classList.add('active');
            if (existDc) existDc.style.display = 'none';
            if (captionEl) captionEl.textContent = '';
            return;
          }

          if (thumb.dataset.type === 'doc') {
            dpImage.classList.remove('active');
            videoWrap.classList.remove('active');
            dpVideo.src = 'about:blank';
            if (existDc) existDc.style.display = 'none';
            const src = thumb.dataset.src;
            const embedUrl = toDocEmbedUrl(src);
            if (embedUrl) {
              dpVideo.src = embedUrl;
              videoWrap.classList.add('active');
            } else {
              const ext = src.split('.').pop().toUpperCase();
              let dc = stage && stage.querySelector('.doc-card');
              if (!dc && stage) { dc = document.createElement('div'); dc.className = 'doc-card'; stage.appendChild(dc); }
              if (dc) {
                dc.innerHTML = `
                  <div class="doc-card-icon">${getDocIcon(ext)}</div>
                  <div class="doc-card-name">${thumb.dataset.label || ext}</div>
                  <div class="doc-card-ext">${ext}</div>
                  <a href="${src}" target="_blank" class="doc-card-btn">Ouvrir ↗</a>
                  <a href="${src}" download class="doc-card-dl">↓ Télécharger</a>`;
                dc.style.display = 'flex';
              }
            }
            if (captionEl) captionEl.textContent = thumb.dataset.caption || '';
            return;
          }

          // image
          if (existDc) existDc.style.display = 'none';
          dpVideo.src = 'about:blank';
          videoWrap.classList.remove('active');
          dpImage.src = thumb.src;
          dpImage.classList.add('active');
          if (captionEl) captionEl.textContent = thumb.dataset.caption || '';
        });
      });
    }

    function initZoom() {
      const img    = document.getElementById('dpImage');
      const lens   = document.getElementById('dpZoomLens');
      const result = document.getElementById('dpZoomResult');
      if (!img || !lens || !result) return;

      function getRenderedArea() {
        const natW = img.naturalWidth, natH = img.naturalHeight;
        if (!natW || !natH) return null;
        const elemW = img.offsetWidth, elemH = img.offsetHeight;
        const natRatio = natW / natH, elemRatio = elemW / elemH;
        let rW, rH, oX, oY;
        if (natRatio > elemRatio) {
          rW = elemW; rH = elemW / natRatio; oX = 0; oY = (elemH - rH) / 2;
        } else {
          rH = elemH; rW = elemH * natRatio; oY = 0; oX = (elemW - rW) / 2;
        }
        return { w: rW, h: rH, x: oX, y: oY };
      }

      function hideZoom() {
        lens.style.display  = 'none';
        result.style.display = 'none';
      }

      function moveZoom(e) {
        if (!img.classList.contains('active') || window.innerWidth < 981) return;
        const area = getRenderedArea();
        if (!area) return;
        const rect = img.getBoundingClientRect();
        const lensW = lens.offsetWidth, lensH = lens.offsetHeight;
        const resW  = result.offsetWidth, resH = result.offsetHeight;

        const curX = e.clientX - rect.left - area.x;
        const curY = e.clientY - rect.top  - area.y;
        if (curX < 0 || curY < 0 || curX > area.w || curY > area.h) {
          hideZoom(); return;
        }

        lens.style.display  = 'block';
        result.style.display = 'block';

        let lx = Math.max(0, Math.min(curX - lensW / 2, area.w - lensW));
        let ly = Math.max(0, Math.min(curY - lensH / 2, area.h - lensH));

        lens.style.left = (area.x + lx) + 'px';
        lens.style.top  = (area.y + ly) + 'px';

        // Zoom result positionné à gauche du panneau (position: fixed)
        const panelRect = detailPanel.getBoundingClientRect();
        result.style.left = Math.max(8, panelRect.left - resW - 16) + 'px';
        result.style.top  = Math.max(8, Math.min(e.clientY - resH / 2, window.innerHeight - resH - 8)) + 'px';

        const cx = resW / lensW, cy = resH / lensH;
        result.style.backgroundImage    = `url('${img.src}')`;
        result.style.backgroundSize     = `${area.w * cx}px ${area.h * cy}px`;
        result.style.backgroundPosition = `-${lx * cx}px -${ly * cy}px`;
      }

      img.addEventListener('mouseleave', hideZoom);
      img.addEventListener('mousemove',  moveZoom);
    }

    // ── Affichage ────────────────────────────────────────────────
    function displayGames() {
      gamesGrid.innerHTML = '';

      const filtered = games.filter(g => {
        const matchType = activeType === 'all' || g.category === activeType;
        const matchMode = activeMode === 'all' || g.mode === activeMode;
        return matchType && matchMode;
      });

      filterCount.innerHTML = `<strong>${filtered.length}</strong> projet${filtered.length > 1 ? 's' : ''}`;

      if (filtered.length === 0) {
        gamesGrid.innerHTML = '<div class="empty-state">Aucun projet ne correspond à ces filtres.</div>';
        return;
      }

      filtered.forEach((game, index) => {
        const card = document.createElement('article');
        card.className = `game-card ${getTypeBadgeClass(game.type)}`;
        card.setAttribute('tabindex', '0');
        card.innerHTML = `
          <div class="game-img"><img src="${game.thumb || game.image}" alt="${game.title}" loading="lazy"></div>
          <div class="game-info">
            <span class="game-type-badge ${getTypeBadgeClass(game.type)}">${game.type}</span>
            <h3>${game.title}</h3>
            <p>${game.year} · ${game.platform || ''}</p>
          </div>
          <span class="game-arrow">↗</span>
        `;
        card.addEventListener('click', () => selectCard(card, game));
        card.addEventListener('keydown', e => {
          if (e.key === 'Enter' || e.key === ' ') selectCard(card, game);
        });
        gamesGrid.appendChild(card);

        if (index === 0) {
          card.classList.add('active');
          activeCardEl = card;
          displayDetails(game);
        }
      });
    }

    function selectCard(card, game) {
      if (activeCardEl) activeCardEl.classList.remove('active');
      card.classList.add('active');
      activeCardEl = card;
      displayDetails(game);
      if (window.innerWidth < 920) openDetailPanel();
    }

    function displayDetails(game) {
      detailPanel.innerHTML = `
        <button class="detail-close" onclick="closeDetailPanel()">✕</button>
        <h2 class="detail-title">${game.title}</h2>
        <div class="detail-meta">${game.type} · ${game.platform || ''} · ${game.year}</div>

        <div class="dp-media-wrap">
          <div class="dp-media-stage" id="dpMediaStage">
            <div class="dp-video-wrap" id="dpVideoWrap">
              <iframe id="dpVideo" src="about:blank" frameborder="0" allowfullscreen
                allow="autoplay; encrypted-media; picture-in-picture"></iframe>
            </div>
            <img id="dpImage" class="dp-main-image" src="" alt="${game.title}">
            <div class="dp-zoom-lens" id="dpZoomLens"></div>
          </div>
          <div class="dp-zoom-result" id="dpZoomResult"></div>
          <div class="dp-thumbs" id="dpThumbsContainer"></div>
          <p id="dpCaption" class="media-caption"></p>
        </div>

        <p class="detail-desc">${game.description}</p>

        <div class="detail-infos">
          <div class="detail-info"><strong>Mon rôle</strong><span>${game.role}</span></div>
          <div class="detail-info"><strong>Équipe</strong><span>${game.team || '—'}</span></div>
          <div class="detail-info"><strong>Moteur</strong><span>${game.engine || '—'}</span></div>
          <div class="detail-info"><strong>Durée</strong><span>${game.duration}</span></div>
        </div>

        <h3 class="contrib-title">Outils</h3>
        <div class="tools-list">
          ${game.tools.map(tool => {
            const icon = getToolIcon(tool);
            return `<div class="tool">${icon ? `<img src="${icon}" class="tool-icon" alt="${tool}">` : ''}<span class="tool-name">${tool}</span></div>`;
          }).join('')}
        </div>

        <h3 class="contrib-title">Mes contributions</h3>
        <ul class="contrib-list">
          ${game.contributions.map(item => `<li>${item}</li>`).join('')}
        </ul>
      `;

      updateProjectMedia(game);
      initZoom();
    }

    function openDetailPanel() {
      detailPanel.classList.add('open');
      detailOverlay.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeDetailPanel() {
      detailPanel.classList.remove('open');
      detailOverlay.classList.remove('open');
      document.body.style.overflow = '';
    }

    detailOverlay.addEventListener('click', closeDetailPanel);
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeDetailPanel();
    });

    // ── Génération automatique des boutons de catégorie ──────────
    (function buildTypeFilters() {
      const typeFilter = document.getElementById('typeFilter');
      const categories = [...new Set(games.map(g => g.category).filter(Boolean))];
      categories.forEach(cat => {
        const btn = document.createElement('button');
        btn.dataset.type = cat;
        btn.textContent = cat;
        typeFilter.appendChild(btn);
      });
    })();

    // ── Filtres ──────────────────────────────────────────────────
    document.getElementById('typeFilter').addEventListener('click', e => {
      const btn = e.target.closest('button[data-type]');
      if (!btn) return;
      document.querySelectorAll('#typeFilter button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeType = btn.dataset.type;
      displayGames();
    });

    document.querySelectorAll('[data-mode]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('[data-mode]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeMode = btn.dataset.mode;
        displayGames();
      });
    });

    // ── Hero blur ────────────────────────────────────────────────
    const hero = document.getElementById('hero');
    function updateHeroOnScroll() {
      const progress = Math.min(window.scrollY / (window.innerHeight * 0.6), 1);
      hero.style.filter = `blur(${progress * 7}px)`;
      hero.style.opacity = Math.max(0.25, 1 - progress * 0.7);
    }
    window.addEventListener('scroll', updateHeroOnScroll, { passive: true });

    displayGames();
    updateHeroOnScroll();
  </script>

  <script>
    (function() {
      const btn = document.getElementById('burgerBtn');
      const drawer = document.getElementById('drawer');
      const overlay = document.getElementById('drawerOverlay');
      if (!btn || !drawer) return;
      btn.addEventListener('click', () => {
        const open = drawer.classList.toggle('open');
        btn.classList.toggle('open', open);
        if (overlay) overlay.style.display = open ? 'block' : 'none';
      });
      drawer.querySelectorAll('a').forEach(a => {
        a.addEventListener('click', () => {
          drawer.classList.remove('open');
          btn.classList.remove('open');
          if (overlay) overlay.style.display = 'none';
        });
      });
      if (overlay) overlay.addEventListener('click', () => {
        drawer.classList.remove('open');
        btn.classList.remove('open');
        overlay.style.display = 'none';
      });
    })();
  </script>
</body>
</html>
